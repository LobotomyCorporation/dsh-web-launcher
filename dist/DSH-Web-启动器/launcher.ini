# DSH Web 启动器配置（改完保存，重新双击启动器即可生效）
# 所有项都可以留空：留空 = 用默认值 / 自动探测。只改你需要的行。

# 网页端口（默认 3080）
port=3080

# dsh web 启动时的工作目录；留空 = 文档目录下的 DSH_Workspace（不存在会自动创建）
workdir=

# dsh 命令的完整路径（dsh.cmd）。留空 = 自动在 PATH 里找
dsh=

# 只有在自动探测失败时才需要填下面两行（node + dsh 的 bin.js）
# node=C:\Program Files\nodejs\node.exe
# bin=%APPDATA%\npm\node_modules\@deepseek-ai\dsh\lib\bin.js